[package]
name = "oops"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "You broke something. oops figures out what."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
supports-color = "3.0.2"
terminal_size = "0.4.4"

[dev-dependencies]
tempfile = "3"
